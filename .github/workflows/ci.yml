name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Resolve modules (generates go.sum on first run)
        run: go mod tidy
      - name: Check module downloads
        run: go mod verify
      - name: Check formatting
        shell: bash
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then printf '%s\n' "$files"; exit 1; fi
      - name: Vet
        run: go vet ./...
      - name: Test without Azure access
        run: go test -race -count=1 ./...
      - name: Build all packages and examples
        run: go build ./...
